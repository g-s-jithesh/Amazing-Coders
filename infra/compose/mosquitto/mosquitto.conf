# Dev broker. ponytail: anonymous plaintext on 1883; mTLS listener (8883, per-OEM/per-VIN certs) arrives with infra/pki (F-10).
listener 1883
allow_anonymous true
persistence false
max_queued_messages 100000
# Per client: bounds unacked QoS 1 messages (the gateway's back-pressure window).
max_inflight_messages 1000
