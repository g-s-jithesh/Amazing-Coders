# Local dev stack. Services are added here as they are built (see CLAUDE.md §15 build order).
# Dev-only credentials come from .env (copy .env.example); defaults below are for local use only.
name: kilowatt

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the dev topics from CLAUDE.md §3.3 (dev partition counts, RF=1), then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mk() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --replication-factor 1 --topic "$$1" --partitions "$$2" $${3:+--config $$3}; }
        for oem in oem_a oem_b oem_c; do mk oem.raw.$$oem.v1 6 retention.ms=259200000; done
        mk telemetry.canonical.v1 6 retention.ms=604800000
        mk telemetry.dlq.v1 1 retention.ms=1209600000
        mk telemetry.rollup.1m.v1 3 retention.ms=604800000
        mk battery.sessions.v1 3 retention.ms=2592000000
        mk vehicle.state.v1 6 cleanup.policy=compact
        mk fleet.vehicle.v1 6 cleanup.policy=compact
        mk alerts.v1 3 retention.ms=2592000000
        mk dispatch.commands.v1 3 retention.ms=2592000000
        mk audit.v1 3 retention.ms=34560000000
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kilowatt}
      POSTGRES_USER: ${POSTGRES_USER:-kilowatt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kilowatt-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
      - ../../data/seed:/seed:ro # generated by `make seed`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest-gateway:
    build:
      context: ../..
      dockerfile: services/ingest-gateway/Dockerfile
    ports: ["8081:8081"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
      GATEWAY_MQTT_URL: tcp://mosquitto:1883
      GATEWAY_MQTT_CONNS: "4"
      GATEWAY_MQTT_CLIENT_ID: ingest-gateway-0
      GATEWAY_HMAC_KEYS: ${GATEWAY_HMAC_KEYS:-sim=dev-only-hmac-secret:oem_a|oem_b|oem_c}
      GATEWAY_DEDUP_EPS: "20000"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mosquitto: { condition: service_healthy }

  # Two roles of one image, each with its own consumer group (see services/stream-processor/CLAUDE.md):
  # processor = rules, alerts, sessions, rollups, state, live map; raw-sink = Scylla telemetry_raw.
  stream-processor:
    build:
      context: ../..
      dockerfile: services/stream-processor/Dockerfile
    ports: ["9102:9102"]
    environment:
      SP_ROLE: processor
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  stream-processor-raw:
    build:
      context: ../..
      dockerfile: services/stream-processor/Dockerfile
    ports: ["9103:9102"]
    environment:
      SP_ROLE: raw-sink
      KAFKA_BOOTSTRAP: kafka:29092
      SCYLLA_HOSTS: scylla:9042
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      scylla-init: { condition: service_completed_successfully }

  scylla:
    image: scylladb/scylla:6.2
    command: --smp 2 --memory 2G --overprovisioned 1 --developer-mode 1 --api-address 0.0.0.0
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Applies services/stream-processor/cql/*.cql (idempotent), then exits.
  scylla-init:
    image: scylladb/scylla:6.2
    depends_on:
      scylla: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c", "for f in /cql/*.cql; do cqlsh scylla -f $$f || exit 1; done"]
    volumes:
      - ../../services/stream-processor/cql:/cql:ro
    restart: "no"

  battery-migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kilowatt}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kilowatt-dev-only}
      PGDATABASE: ${POSTGRES_DB:-kilowatt}
    # Apply the schema as the owner, then (re)load the DTC reference table from the catalogue CSV.
    entrypoint:
      - /bin/bash
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -q -f /migrations/0001_battery_core.sql &&
        psql -v ON_ERROR_STOP=1 -q -1 -c 'TRUNCATE battery.dtc_code' -c "\copy battery.dtc_code FROM '/ref/dtc_catalogue.csv' CSV HEADER"
    volumes:
      - ../../services/battery-intel/migrations:/migrations:ro
      - ../../data/reference/dtc_catalogue.csv:/ref/dtc_catalogue.csv:ro
    restart: "no"

  battery-intel:
    build:
      context: ../..
      dockerfile: services/battery-intel/Dockerfile
    ports: ["127.0.0.1:8001:8001"] # loopback only: tenant comes from X-Tenant-Id until F-10 (JWT)
    environment:
      DATABASE_URL: postgresql://battery_app:battery-app-dev-only@postgres:5432/${POSTGRES_DB:-kilowatt}
    depends_on:
      battery-migrate: { condition: service_completed_successfully }

  battery-worker:
    build:
      context: ../..
      dockerfile: services/battery-intel/Dockerfile
    command: ["python", "-m", "app.workers.session_consumer"]
    restart: unless-stopped # transient DB/Kafka errors exit; the uncommitted batch is re-read on restart
    ports: ["9104:9104"]
    environment:
      DATABASE_URL: postgresql://battery_app:battery-app-dev-only@postgres:5432/${POSTGRES_DB:-kilowatt}
      KAFKA_BOOTSTRAP: kafka:29092
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/metrics', timeout=2)"]
    depends_on:
      battery-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  dispatch-migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kilowatt}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kilowatt-dev-only}
      PGDATABASE: ${POSTGRES_DB:-kilowatt}
    # Apply the schema as the owner, then (re)load the reference tariffs.
    entrypoint:
      - /bin/bash
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -q -f /migrations/0001_dispatch_core.sql &&
        psql -v ON_ERROR_STOP=1 -q -1 -c 'TRUNCATE dispatch.tariff_window' -c "\copy dispatch.tariff_window FROM '/ref/tariffs.csv' CSV HEADER"
    volumes:
      - ../../services/dispatch-optimizer/migrations:/migrations:ro
      - ../../data/reference/tariffs.csv:/ref/tariffs.csv:ro
    restart: "no"

  dispatch-optimizer:
    build:
      context: ../..
      dockerfile: services/dispatch-optimizer/Dockerfile
    ports: ["127.0.0.1:8002:8002"] # loopback only: caller identity comes from headers until F-10 (JWT)
    environment:
      DATABASE_URL: postgresql://dispatch_app:dispatch-app-dev-only@postgres:5432/${POSTGRES_DB:-kilowatt}
      SEED_DIR: /srv/data/seed # dev fleet source until fleet-api serves depot snapshots (Step 8)
    volumes:
      - ../../data/seed:/srv/data/seed:ro
    depends_on:
      dispatch-migrate: { condition: service_completed_successfully }

  dispatch-relay:
    build:
      context: ../..
      dockerfile: services/dispatch-optimizer/Dockerfile
    command: ["python", "-m", "app.workers.outbox_relay"]
    restart: unless-stopped
    environment:
      RELAY_DATABASE_URL: postgresql://dispatch_relay:dispatch-relay-dev-only@postgres:5432/${POSTGRES_DB:-kilowatt}
      KAFKA_BOOTSTRAP: kafka:29092
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
    depends_on:
      dispatch-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  redis:
    image: redis:8.0
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
