# Generated Protobuf code for Python services (make proto-gen). Namespace package `kilowatt`.
[project]
name = "kilowatt-proto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["protobuf>=5.29,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kilowatt"]
